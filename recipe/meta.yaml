{% set name = "mdsplus" %}
{% set version = "7.160.3" %}
{% set sha256 = "a696359482d3e8dcc0a90810dec2fe6460b897e9a0ee35cd416234d6ccd869db" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/MDSplus/{{ name }}/archive/refs/tags/alpha_release-{{ version | replace('.','-') }}.tar.gz
  sha256: {{ sha256 }}

  # patches:
  #   - Makefile.inc.in.patch  # [osx]
  #   - _include_pthread_port.h.patch  # [osx]
  #   - _include__mdsversion.h.in.patch  # [osx]
build:
  number: 1
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - automake
    - autoconf
    - bison
    - flex
    - gperf
    - make
    - cmake
    - libxml2-devel
  host:
    - freetds 1.*
    - libiconv
    - libxml2-devel
    - pynose
    - perl
    - pip
    - pkg-config
    - python
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - numpy 2.*
    - readline
    - setuptools
    - zlib
  run:
    - freetds 1.*
    - numpy 2.*
    - python

test:
  imports:
    - MDSplus
  commands:
    # The python package has shipped without a version, or stamped with the
    # previous release, more than once; both are silent until runtime.
    - python -c "import MDSplus; assert MDSplus.__version__ == '{{ version }}', MDSplus.__version__"

about:
  home: http://www.mdsplus.org/
  license: MIT
  license_family: MIT
  license_file: MDSplus-License.txt
  summary: MDSplus data management system
  description: |
    MDSplus is a set of software tools for data acquisition and
    storage and a methodology for management of complex
    scientific data.

    MDSplus allows all data from an experiment or simulation
    code to be stored into a single, self-descriptive,
    hierarchical structure. The system was designed to enable
    users to easily construct complete and coherent data sets.

    The MDSplus programming interface contains only a few basic
    commands, simplifying data access even into complex
    structures. Using the client/server model, data at remote
    sites can be read or written without file transfers.
    MDSplus includes x-windows and java tools for viewing data
    or for modifying or viewing the underlying structures.
  dev_url: https://github.com/MDSplus/mdsplus

extra:
  recipe-maintainers:
    - smithsp
    - modestmc
    - wdeshazer
